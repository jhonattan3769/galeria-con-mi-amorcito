<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- 1. BLOQUEO DE ZOOM EN VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jhonattan y Debora - Álbum 3D</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFF9C4">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💙</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* 2. BLOQUEO GLOBAL DE GESTOS Y SELECCIÓN TÁCTIL */
        * {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --accent-color: #008080;
            --bg-modal: rgba(0,0,0,0.8);
            --paper-color: #F8F5E6;
        }

        body {
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif;
            background-color: #FFF9C4;
            height: 100vh; overflow: hidden; display: flex;
            justify-content: center; align-items: center;
        }

        /* Aviso de rotación de pantalla */
        #rotate-message {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--paper-color);
            z-index: 9999; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        #rotate-message h2 { font-family: 'Great Vibes', cursive; font-size: 3em; color: #333; margin: 0; }
        #rotate-message p { font-size: 1.2em; color: #666; margin-top: 10px; padding: 0 20px;}
        .rotate-icon { font-size: 50px; margin-bottom: 20px; animation: spin 2s infinite ease-in-out; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(-90deg); } }

        /* --- MESA Y NAVEGACIÓN --- */
        #desktop {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%; position: relative;
            cursor: grab;
        }
        #desktop:active { cursor: grabbing; }

        /* --- LIBRO 3D --- */
        #album-wrapper {
            perspective: 1500px;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            margin: auto; /* Margen de seguridad */
        }

        #album {
            width: 45vw; height: 90vh; position: relative;
            transform-style: preserve-3d;
        }

        .leaf {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d; transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            /* 3A. ACELERACIÓN POR HARDWARE */
            will-change: transform;
        }

        .leaf.flipped { transform: rotateY(-180deg); }

        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; background: var(--paper-color);
            box-shadow: inset 0 0 40px rgba(139, 69, 19, 0.15), 0 0 10px rgba(0,0,0,0.2);
            border-radius: 2px 10px 10px 2px; padding: 15px; /* Reducido para evitar recortes */
            box-sizing: border-box; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            overflow: hidden;
            /* 3B. ACELERACIÓN POR HARDWARE */
            will-change: transform;
        }

        .face.back {
            transform: rotateY(180deg);
            border-radius: 10px 2px 2px 10px;
        }

        /* --- CONTENIDO DE PORTADAS --- */
        .cover-title {
            font-family: 'Great Vibes', cursive; font-size: 5vw;
            color: #333; line-height: 1.2; margin: 0;
        }
        .cover-heart { color: var(--accent-color); font-size: 2vw; margin: 10px 0; }
        .cover-subtitle { font-size: 1.2vw; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-top: 30px; }
        
        .page-text { font-family: 'Great Vibes', cursive; font-size: 2.5em; color: #555; }

        /* --- GRID DE 4 FOTOS --- */
        .page-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px; /* Gap ajustado */
            width: 100%;
            height: 100%;
            padding: 5px;
            box-sizing: border-box;
            align-items: center;
            justify-items: center;
        }

        /* --- FOTOS POLAROID Y CINTA --- */
        .polaroid-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
        
        .polaroid {
            background: white; padding: 6px 6px 20px 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 1px solid #eee;
            position: relative; transition: transform 0.3s;
            max-width: 19vw; /* Límite para evitar desbordes */
            max-height: 38vh;
        }
        .polaroid:hover { transform: scale(1.05); z-index: 10; }
        
        .polaroid img {
            width: 16vw; height: 30vh; object-fit: cover; cursor: pointer;
            filter: sepia(15%);
        }

        .washi-tape {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%) rotate(-3deg);
            width: 50px; height: 15px; background: rgba(220, 200, 180, 0.7);
            border: 1px dashed rgba(0,0,0,0.1); z-index: 5;
        }

        .delete-btn {
            position: absolute; top: -8px; right: -8px; background: #d9534f;
            color: white; border: 2px solid white; width: 22px; height: 22px; border-radius: 50%;
            cursor: pointer; font-weight: bold; opacity: 0; transition: opacity 0.3s;
            display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 10px;
        }
        .polaroid:hover .delete-btn { opacity: 1; }

        /* --- BOTÓN FLOTANTE (Corazón minimalista con '+') --- */
        #fab-upload {
            position: fixed; bottom: 4vh; right: 2vw; /* Distancia segura de la esquina */
            background: transparent; border: none;
            padding: 0; cursor: pointer;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 500;
        }
        #fab-upload:hover { transform: translateY(-5px) scale(1.1); filter: drop-shadow(0 8px 20px rgba(0,128,128,0.4)); }
        #fab-upload svg { display: block; }

        /* --- MODALES --- */
        .modal-upload {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: var(--bg-modal);
            align-items: center; justify-content: center;
        }
        .modal-content-upload {
            background: #FDF5E6; padding: 40px; border-radius: 10px; text-align: center;
            position: relative; max-width: 400px; width: 90%;
        }
        .close-upload {
            position: absolute; top: 15px; right: 20px; font-size: 30px; cursor: pointer; color: #555;
        }
        
        .custom-file-upload {
            border: 1px solid #ccc; display: inline-block; padding: 10px 20px;
            cursor: pointer; background: white; text-transform: uppercase; margin: 20px 0;
        }
        button#submit-btn {
            background: var(--accent-color); color: white; border: none; padding: 12px 30px;
            text-transform: uppercase; cursor: pointer; width: 100%; font-weight: bold;
        }
        button#submit-btn:disabled { background: #ccc; }

        /* Modal para visualizar fotos ajustado */
        .modal-view { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; }
        .modal-content-view { max-width: 90vw; max-height: 80vh; border: 8px solid white; object-fit: contain; margin: auto; display: block;}
        .close-view { position: absolute; top: 20px; right: 40px; color: #f1f1f1; font-size: 50px; font-weight: bold; cursor: pointer; z-index: 2001; }

        /* Estilos del Custom Dialog */
        .dialog-input { display:none; width: 80%; padding: 10px; margin: 15px auto; border: 1px solid #ccc; font-family: 'Montserrat', sans-serif; }
        .dialog-btn-container { display:flex; justify-content:center; gap: 15px; margin-top: 20px;}
        .dialog-btn { border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight: bold; font-family: 'Montserrat', sans-serif;}
        .dialog-confirm { background:var(--accent-color); color:white; }
        .dialog-cancel { background:#ccc; color:#333; display:none; }

        /* Detectar si el celular está en vertical */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            #desktop, #fab-upload { display: none !important; }
            #rotate-message { display: flex; }
        }
    </style>
</head>
<body>

    <!-- Aviso de rotación -->
    <div id="rotate-message">
        <div class="rotate-icon">📱</div>
        <h2>Por favor, gira tu dispositivo</h2>
        <p>Este álbum se disfruta mejor en formato horizontal.</p>
    </div>

    <!-- MESA Y LIBRO -->
    <div id="desktop">
        <div id="album-wrapper">
            <div id="album">
                <!-- Las hojas se generarán por JavaScript -->
            </div>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE (Corazón minimalista con '+') -->
    <button id="fab-upload" onclick="document.getElementById('uploadModal').style.display='flex'" title="Añadir Recuerdo">
        <svg viewBox="0 0 24 24" width="70" height="70">
            <path fill="var(--accent-color)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            <line x1="8.5" y1="9.5" x2="15.5" y2="9.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="12" y1="6" x2="12" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
    </button>

    <!-- Modal Formulario Subida -->
    <div id="uploadModal" class="modal-upload">
        <div class="modal-content-upload">
            <span class="close-upload" onclick="document.getElementById('uploadModal').style.display='none'">&times;</span>
            <h2 style="font-family: 'Great Vibes', cursive; font-size: 3em; margin: 0; color: #333;">Nuevo Momento</h2>
            <form id="upload-form">
                <label class="custom-file-upload">
                    <input type="file" id="photo-input" name="photo" accept="image/*" required>
                    📷 SELECCIONAR FOTO
                </label>
                <div id="file-name-display" style="font-size: 0.9em; margin-bottom: 15px; color: #666;"></div>
                <button type="submit" id="submit-btn">SUBIR FOTO</button>
            </form>
        </div>
    </div>

    <!-- Custom Dialog Modal (Reemplazo alert y prompt nativos) -->
    <div id="customDialog" class="modal-upload" style="z-index: 3000;">
        <div class="modal-content-upload" style="max-width: 350px;">
            <h3 id="dialogMsg" style="color: #333; margin: 0 0 10px 0; font-family: 'Montserrat', sans-serif;"></h3>
            <input type="password" id="dialogInput" class="dialog-input" placeholder="Contraseña">
            <div class="dialog-btn-container">
                <button id="dialogCancel" class="dialog-btn dialog-cancel">Cancelar</button>
                <button id="dialogConfirm" class="dialog-btn dialog-confirm">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ver Foto -->
    <div id="viewModal" class="modal-view">
        <span class="close-view" onclick="document.getElementById('viewModal').style.display='none'">&times;</span>
        <img class="modal-content-view" id="img-viewer">
    </div>

    <script>
        // 4. JAVASCRIPT: BLOQUEO DE ZOOM POR DOBLE TOQUE Y PELLIZCO
        document.addEventListener('dblclick', function(event) {
            event.preventDefault();
        }, { passive: false });
        
        document.addEventListener('gesturestart', function(event) {
            event.preventDefault();
        });

        const API_URL = 'https://galeria-con-mi-amorcito.onrender.com'; 
        let currentLeaf = 0;
        let totalLeaves = 0;

        // Fotos base si no hay en el servidor
        const fallbackPhotos = [
            'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=400',
            'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400',
            'https://images.unsplash.com/photo-1606277254581-2292f74fb8a6?w=400',
            'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400',
            'https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=400',
            'https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=400'
        ];

        // --- SISTEMA DE DIÁLOGOS PERSONALIZADOS ---
        function customAlert(msg, callback) {
            const dialog = document.getElementById('customDialog');
            document.getElementById('dialogMsg').innerText = msg;
            document.getElementById('dialogInput').style.display = 'none';
            document.getElementById('dialogCancel').style.display = 'none';
            dialog.style.display = 'flex';
            document.getElementById('dialogConfirm').onclick = () => {
                dialog.style.display = 'none';
                if(callback) callback();
            };
        }

        function customPrompt(msg, callback) {
            const dialog = document.getElementById('customDialog');
            const input = document.getElementById('dialogInput');
            document.getElementById('dialogMsg').innerText = msg;
            input.style.display = 'block';
            input.value = '';
            document.getElementById('dialogCancel').style.display = 'block';
            dialog.style.display = 'flex';
            
            document.getElementById('dialogConfirm').onclick = () => {
                dialog.style.display = 'none';
                callback(input.value);
            };
            document.getElementById('dialogCancel').onclick = () => {
                dialog.style.display = 'none';
                callback(null);
            };
        }

        // --- LÓGICA DEL LIBRO 3D Y GRID 4 FOTOS ---
        function chunkArray(myArray, chunk_size){
            var results = [];
            var clone = [...myArray];
            while (clone.length) {
                results.push(clone.splice(0, chunk_size));
            }
            return results;
        }

        function buildBook(photos) {
            const album = document.getElementById('album');
            album.innerHTML = ''; 
            
            const coverFront = `
                <h1 class="cover-title">Jhonattan</h1>
                <div class="cover-heart">❤</div>
                <h1 class="cover-title">Debora</h1>
                <div class="cover-subtitle">Nuestro Álbum</div>
            `;
            const coverBack = `<div class="page-text">Nuestra historia...</div>`;
            album.appendChild(createLeaf(coverFront, coverBack));

            let chunks = chunkArray(photos, 4);
            const numPhotoLeaves = Math.ceil(chunks.length / 2);
            
            for(let i = 0; i < numPhotoLeaves; i++) {
                let frontPhotos = chunks[i * 2] || [];
                let backPhotos = chunks[i * 2 + 1] || [];
                
                let frontHTML = frontPhotos.length > 0 
                    ? `<div class="page-grid">${frontPhotos.map(createPhotoElement).join('')}</div>` 
                    : '<div class="page-text">Espacio para recuerdos...</div>';
                    
                let backHTML = backPhotos.length > 0 
                    ? `<div class="page-grid">${backPhotos.map(createPhotoElement).join('')}</div>` 
                    : '<div class="page-text">Espacio para recuerdos...</div>';
                
                album.appendChild(createLeaf(frontHTML, backHTML));
            }

            const endFront = `<div class="page-text">Y esto recién empieza...</div>`;
            const endBack = `<h1 class="cover-title">Por siempre</h1><div class="cover-heart" style="font-size:3vw">❤</div>`;
            album.appendChild(createLeaf(endFront, endBack));

            totalLeaves = album.querySelectorAll('.leaf').length;
            updateBookView();
        }

        function createLeaf(frontHTML, backHTML) {
            const div = document.createElement('div');
            div.className = 'leaf';
            div.innerHTML = `
                <div class="face front">${frontHTML}</div>
                <div class="face back">${backHTML}</div>
            `;
            return div;
        }

        function createPhotoElement(url) {
            const filename = url.split('/').pop();
            const rotation = (Math.random() * 6 - 3).toFixed(1); 
            
            return `
                <div class="polaroid-wrapper" style="transform: rotate(${rotation}deg)">
                    <div class="washi-tape"></div>
                    <div class="polaroid">
                        <img src="${url}" onclick="openViewModal('${url}')" onerror="this.src='https://placehold.co/400x400/eeeeee/999999?text=Foto+No+Disponible'">
                        <button class="delete-btn" onclick="deletePhoto('${filename}', event)">×</button>
                    </div>
                </div>
            `;
        }

        // --- NAVEGACIÓN ---
        function turnPage(direction) {
            if(direction === 'next' && currentLeaf < totalLeaves) { currentLeaf++; } 
            else if (direction === 'prev' && currentLeaf > 0) { currentLeaf--; }
            updateBookView();
        }

        function updateBookView() {
            const leaves = document.querySelectorAll('.leaf');
            const wrapper = document.getElementById('album-wrapper');

            leaves.forEach((leaf, index) => {
                leaf.style.transition = ''; 
                leaf.style.transform = '';  

                if (index < currentLeaf) {
                    leaf.classList.add('flipped');
                    leaf.style.zIndex = index + 1; 
                } else {
                    leaf.classList.remove('flipped');
                    leaf.style.zIndex = totalLeaves - index; 
                }
            });

            if (currentLeaf === 0) wrapper.style.transform = 'translateX(0)'; 
            else if (currentLeaf === totalLeaves) wrapper.style.transform = 'translateX(100%)'; 
            else wrapper.style.transform = 'translateX(50%)'; 
        }

        // --- CONEXIÓN API ---
        async function loadPhotos() {
            try {
                const res = await fetch(`${API_URL}/photos`);
                if(res.ok) {
                    const photos = await res.json();
                    buildBook(photos.length ? photos : fallbackPhotos);
                } else { buildBook(fallbackPhotos); }
            } catch (err) { buildBook(fallbackPhotos); }
        }

        const photoInput = document.getElementById('photo-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const submitBtn = document.getElementById('submit-btn');

        photoInput.addEventListener('change', function() {
            if (this.files && this.files[0]) fileNameDisplay.textContent = this.files[0].name;
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = photoInput.files[0];
            if(!file) return;
            
            const formData = new FormData();
            formData.append('photo', file);
            
            submitBtn.innerText = 'GUARDANDO...';
            submitBtn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) {
                    customAlert('¡Recuerdo guardado con éxito!');
                    document.getElementById('uploadModal').style.display = 'none';
                    document.getElementById('upload-form').reset();
                    fileNameDisplay.textContent = '';
                    loadPhotos(); 
                } else { customAlert('Error: ' + data.message); }
            } catch (err) { customAlert('Error de conexión.'); }
            finally { submitBtn.innerText = 'SUBIR FOTO'; submitBtn.disabled = false; }
        });

        function deletePhoto(filename, event) {
            event.stopPropagation();
            customPrompt("Introduce la contraseña secreta para eliminar:", async (password) => {
                if(!password) return;

                try {
                    const res = await fetch(`${API_URL}/delete/${filename}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await res.json();
                    if(data.success) { 
                        customAlert('Recuerdo eliminado.'); 
                        loadPhotos(); 
                    } else { customAlert(data.message); }
                } catch (err) { customAlert('Error de conexión.'); }
            });
        }

        function openViewModal(url) {
            document.getElementById("viewModal").style.display = "flex";
            document.getElementById("img-viewer").src = url;
        }

        // --- EVENTOS DE ARRASTRE TÁCTIL Y RATÓN (SWIPE 3D) ---
        const albumEl = document.getElementById('album');
        let isDragging = false;
        let startX = 0;
        let dragLeaf = null;
        let dragDirection = null;

        function startDrag(e) {
            if(e.target.tagName === 'BUTTON' || (e.target.tagName === 'IMG' && e.target.closest('.polaroid')) || e.target.closest('.modal-upload')) return;
            
            isDragging = true;
            startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            
            const albumRect = albumEl.getBoundingClientRect();
            const clickX = startX - albumRect.left;
            const leaves = document.querySelectorAll('.leaf');
            
            if (clickX > albumRect.width / 2 && currentLeaf < totalLeaves) {
                dragDirection = 'next';
                dragLeaf = leaves[currentLeaf];
            } else if (clickX <= albumRect.width / 2 && currentLeaf > 0) {
                dragDirection = 'prev';
                dragLeaf = leaves[currentLeaf - 1];
            } else { dragLeaf = null; }

            if (dragLeaf) dragLeaf.style.transition = 'none';
        }

        function onDrag(e) {
            if (!isDragging || !dragLeaf) return;
            e.preventDefault(); 
            
            const currentX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            let deltaX = currentX - startX;
            const albumWidth = albumEl.offsetWidth;
            
            if (dragDirection === 'next') {
                if (deltaX > 0) deltaX = 0; 
                let angle = (deltaX / albumWidth) * 180;
                if (angle < -180) angle = -180;
                dragLeaf.style.transform = `rotateY(${angle}deg)`;
            } else if (dragDirection === 'prev') {
                if (deltaX < 0) deltaX = 0; 
                let angle = -180 + ((deltaX / albumWidth) * 180);
                if (angle > 0) angle = 0;
                dragLeaf.style.transform = `rotateY(${angle}deg)`;
            }
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            if (dragLeaf) {
                dragLeaf.style.transition = ''; 
                
                const endX = e.type.includes('mouse') ? e.pageX : e.changedTouches[0].pageX;
                const deltaX = endX - startX;
                const threshold = albumEl.offsetWidth * 0.15; 
                
                if (dragDirection === 'next' && deltaX < -threshold) turnPage('next');
                else if (dragDirection === 'prev' && deltaX > threshold) turnPage('prev');
                else updateBookView(); 
                
                dragLeaf = null;
            }
        }

        albumEl.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag, {passive: false});
        document.addEventListener('mouseup', endDrag);

        albumEl.addEventListener('touchstart', startDrag, {passive: true});
        document.addEventListener('touchmove', onDrag, {passive: false});
        document.addEventListener('touchend', endDrag);

        window.onload = loadPhotos;

        // --- SERVICE WORKER (PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('SW Registrado'))
                    .catch(err => console.log('SW bloqueado temporalmente (comportamiento esperado en lienzo).'));
            });
        }
    </script>
</body>
</html>
